[tools]
rust = { version = "latest", targets = "wasm32-unknown-unknown" }
"cargo:trunk" = "latest"
"cargo:stylance-cli" = "latest"

[tasks.build]
description = "Build every lab and the course project natively"
run = "cargo build --workspace --exclude web"
sources = ["Cargo.toml", "Cargo.lock", "framework/**", "lab-*/Cargo.toml", "lab-*/src/**", "lab-*/res/**", "course-project/Cargo.toml", "course-project/src/**"]
outputs = { auto = true }

[tasks.run]
description = "Run one lab natively"
usage = 'arg "<num>" help="lab number (1-3)"'
run = 'cargo run -p lab-{{ usage.num }}'

[tasks."run-course-project"]
description = "Run the course project natively"
run = "cargo run -p course-project"

[tasks.web]
description = "Build the web application with every lab and the course project"
dir = "web"
run = "trunk build --release"

[tasks."web-serve"]
description = "Serve the web application locally"
dir = "web"
run = "trunk serve"

[tasks."ensure-reports-dir"]
extends = "mkdir"

[tasks.report]
description = "Compile one lab's report to PDF"
usage = 'arg "<num>" help="lab number (1-3)"'
depends = [{ task = "ensure-reports-dir", args = ["reports"] }]
run = 'typst compile --root . "lab-{{ usage.num }}/report.typ" "reports/lab-{{ usage.num }}.pdf"'

[tasks."course-work"]
description = "Compile the course project to PDF"
depends = [{ task = "ensure-reports-dir", args = ["reports"] }]
run = 'typst compile --root . "course-project/course-work.typ" "reports/course-work.pdf"'
sources = ["course-project/**/*.typ", "course-project/bibliography.yaml", "course-project/assets/**", "course-project/src/**", "framework/src/**", "web/**"]
outputs = ["reports/course-work.pdf"]

[tasks."report-all"]
description = "Compile every report of the course"
depends = [
  { task = "report", args = ["1"] },
  { task = "report", args = ["2"] },
  { task = "report", args = ["3"] },
  "course-work",
]

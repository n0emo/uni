[tasks.sync]
description = "Install the Python environment"
run = "uv sync"
sources = ["pyproject.toml", "uv.lock"]
outputs = { auto = true }

[tasks.lab]
description = "Launch a JupyterLab server for the lab 1 notebooks"
depends = ["sync"]
run = "uv run jupyter-lab"

[tasks.run]
description = "Run lab 2 (qubits, gates and Deutsch's algorithm)"
depends = ["sync"]
run = "uv run lab-2/src/lab.py"

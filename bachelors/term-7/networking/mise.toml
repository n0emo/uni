[tasks."ensure-reports-dir"]
extends = "mkdir"

[tasks.report]
description = "Compile one lab's report to PDF"
usage = 'arg "<num>" help="lab number (1-6)"'
depends = [{ task = "ensure-reports-dir", args = ["reports"] }]
run = 'typst compile --root . "lab-{{ usage.num }}/report.typ" "reports/lab-{{ usage.num }}.pdf"'

[tasks."report-all"]
description = "Compile every lab's report"
depends = [
  { task = "report", args = ["1"] },
  { task = "report", args = ["2"] },
  { task = "report", args = ["3"] },
  { task = "report", args = ["4"] },
  { task = "report", args = ["5"] },
  { task = "report", args = ["6"] },
]

[tasks."course-work"]
description = "Compile the course project to PDF"
depends = [{ task = "ensure-reports-dir", args = ["reports"] }]
run = 'typst compile --root . "course-project/course-work.typ" "reports/course-work.pdf"'
sources = ["course-project/**"]
outputs = ["reports/course-work.pdf"]

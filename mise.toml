monorepo_root = true

[monorepo]
config_roots = [
  "./bachelors/pre-graduation-practice/",
  "./bachelors/term-1/intro-to-c/",
  "./bachelors/term-1/maths/",
  "./bachelors/term-2/programming-c/",
  "./bachelors/term-2/programming-cpp/",
  "./bachelors/term-6/ai-systems/",
  "./bachelors/term-7/information-security/",
  "./bachelors/term-7/networking/",
  "./bachelors/term-8/human-machine-interaction/",
  "./bachelors/term-8/information-system-architecture/",
  "./bachelors/term-8/metrology-standardization-certification/",
  "./bachelors/thesis/",
  "./masters/term-1/microelectronic-control-systems/",
  "./masters/term-1/modern-programming-methods/",
  "./masters/term-1/modern-programming-methods/practice-1/",
]

[tools]
cmake = "4.4.4"
dotnet = "10.0.401"
gleam = "1.18.1"
miniserve = "0.35.0"
ninja = "1.13.2"
pandoc = "3.12"
tinymist = "0.15.8"
tinytex = "2026.10"
typst = "0.15.1"
typstyle = "0.15.1"
uv = "0.12.23"
watchexec = "2.7.4"

[task_templates.mkdir]
description = "Ensure a directory exists"
usage = 'arg "<dir>" help="directory to create"'
run = 'mkdir -p "{{ usage.dir }}"'
run_windows = 'if not exist "{{ usage.dir }}" mkdir "{{ usage.dir }}"'

[task_templates."cmake:configure"]
description = "Configure a CMake project with Ninja"
run = "cmake -S . -B build -G Ninja"

[task_templates."cmake:build"]
description = "Build a configured CMake project"
run = "cmake --build build"

[task_templates."typst:compile"]
description = "Compile a Typst document to PDF"
usage = '''
arg "<input>" help="path to the .typ entry point"
arg "<output>" help="path to the output .pdf"
'''
run = 'typst compile --root . "{{ usage.input }}" "{{ usage.output }}"'

[task_templates."dotnet:build"]
description = "Build a .NET project"
run = "dotnet build"
sources = ["**/*.fs", "**/*.fsproj", "**/*.json"]
outputs = { auto = true }

[task_templates."dotnet:run"]
description = "Run a .NET project, ignoring launchSettings.json"
run = "dotnet run --no-launch-profile"

[task_templates."dotnet:watch"]
description = "Run a .NET project, rebuilding on changes"
run = "dotnet watch run --no-launch-profile"

[task_templates."dotnet:publish"]
description = "Publish a .NET project in Release configuration"
run = "dotnet publish -c Release -o publish"
